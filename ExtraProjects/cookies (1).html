<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cookies</title>
</head>
<body>

    <script language ="JavaScript">

        "use strict";

        var quebralinha = "<br />";
        document.write("Coikies em JavaScript");
        document.write(quebralinha);

        var data = new Date();

        data.setTime(data.getTime() + (1000*60*60*24));

        document.cookie = "nome=Jose;expires=" + data.toUTCString() + ";path=/";
        document.cookie = "aula=Javascript;expires=" + data.toUTCString() + ";path=/";
    </script>

</body>
</html>
