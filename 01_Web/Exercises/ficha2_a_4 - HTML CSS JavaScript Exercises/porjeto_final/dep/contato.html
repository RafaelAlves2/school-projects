<!DOCTYPE html>
<html lang="pt-br">
<head>
    <!-- Mesmo head do index.html -->
</head>
<body>
    <header>
        <!-- Mesmo header do index.html -->
    </header>

    <section class="contact-page">
        <div class="container">
            <h1>Fale Conosco</h1>
            <h2>Tire suas dúvidas ou envie sugestões</h2>
            
            <form id="contact-form" action="#" method="POST">
                <fieldset>
                    <legend>Informações Pessoais</legend>
                    
                    <div class="form-group">
                        <label for="nome">Nome Completo:</label>
                        <input type="text" id="nome" name="nome" required autofocus>
                    </div>
                    
                    <div class="form-group">
                        <label for="email">E-mail:</label>
                        <input type="email" id="email" name="email" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="telefone">Telefone:</label>
                        <input type="text" id="telefone" name="telefone">
                    </div>
                </fieldset>
                
                <fieldset>
                    <legend>Assunto</legend>
                    
                    <div class="form-group">
                        <label>Tipo de Mensagem:</label>
                        <div class="radio-group">
                            <input type="radio" id="duvida" name="tipo" value="duvida" checked>
                            <label for="duvida">Dúvida</label>
                            
                            <input type="radio" id="sugestao" name="tipo" value="sugestao">
                            <label for="sugestao">Sugestão</label>
                            
                            <input type="radio" id="reclamacao" name="tipo" value="reclamacao">
                            <label for="reclamacao">Reclamação</label>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label for="mensagem">Mensagem:</label>
                        <textarea id="mensagem" name="mensagem" rows="5" required></textarea>
                    </div>
                </fieldset>
                
                <fieldset>
                    <legend>Preferências (Opcional)</legend>
                    
                    <div class="form-group">
                        <label>Como conheceu nossa loja?</label>
                        <select name="conheceu">
                            <option value="">Selecione...</option>
                            <option value="google">Google</option>
                            <option value="rede-social">Rede Social</option>
                            <option value="indicacao">Indicação</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label>Deseja receber promoções?</label>
                        <div class="checkbox-group">
                            <input type="checkbox" id="promocoes-email" name="promocoes-email" value="sim">
                            <label for="promocoes-email">Por e-mail</label>
                            
                            <input type="checkbox" id="promocoes-sms" name="promocoes-sms" value="sim">
                            <label for="promocoes-sms">Por SMS</label>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label for="idade">Sua idade:</label>
                        <input type="number" id="idade" name="idade" min="12" max="120">
                    </div>
                </fieldset>
                
                <div class="form-group">
                    <label for="senha">Crie uma senha para cadastro (opcional):</label>
                    <input type="password" id="senha" name="senha">
                </div>
                
                <button type="submit" class="btn">Enviar Mensagem</button>
            </form>
        </div>
    </section>

    <footer>
        <!-- Mesmo footer do index.html -->
    </footer>

    <script src="script.js"></script>
</body>
</html>
